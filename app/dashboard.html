<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The-Trader | Paper Agent</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#0b1020;color:#e8eefc}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 8px}.muted{color:#91a0bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:24px 0}.card{background:#121a2c;border:1px solid #25304a;border-radius:14px;padding:18px}.value{font-size:28px;font-weight:700;margin-top:6px}button{background:#4f7cff;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:7px 10px;border-radius:20px;background:#193524;color:#7ee2a8}.danger{background:#38202a;color:#ff9aa9}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #273149;font-size:13px}
</style>
</head>
<body><main>
<div class="row"><div><h1>The-Trader</h1><div class="muted">Self-improving paper trading research agent</div></div><span id="mode" class="status">paper-only</span></div>
<div class="grid" id="metrics"></div>
<div class="card"><div class="row"><button id="backtest">Run Backtest</button><button id="improve">Run Improvement Cycle</button><span id="msg" class="muted"></span></div></div>
<div class="grid"><div class="card"><h3>Strategy</h3><pre id="strategy">Loading...</pre></div><div class="card"><h3>Recent Experiments</h3><div id="experiments" class="muted">Loading...</div></div></div>
<div class="card"><h3>Recent Trades</h3><div id="trades" class="muted">Loading...</div></div>
<script>
const $=id=>document.getElementById(id);
const fmt=x=>typeof x==='number'?x.toFixed(4):String(x);
async function get(u){const r=await fetch(u);if(!r.ok)throw Error(await r.text());return r.json()}
function cards(goal){const data=[['Return',fmt((goal?.return_pct||0)*100)+'%'],['Max drawdown',fmt((goal?.max_drawdown_pct||0)*100)+'%'],['Score',fmt(goal?.score||0)],['Trades',goal?.trades??0],['Risk violations',goal?.risk_violations??0]];$('metrics').innerHTML=data.map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="value">${b}</div></div>`).join('')}
async function refresh(){try{const [s,e,t,r]=await Promise.all([get('/api/status'),get('/api/experiments'),get('/api/trades'),get('/api/runs')]);$('strategy').textContent=JSON.stringify(s.strategy,null,2);$('experiments').innerHTML=e.length?e.slice(0,8).map(x=>`<div><b>${x.accepted?'ACCEPTED':'REJECTED'}</b> ${x.reason} · ${fmt(x.candidate_score)}</div>`).join(''):'No experiments yet';$('trades').innerHTML=t.length?`<table><tr><th>Side</th><th>Price</th><th>Qty</th><th>Reason</th></tr>${t.slice(0,12).map(x=>`<tr><td>${x.side}</td><td>${fmt(x.price)}</td><td>${fmt(x.quantity)}</td><td>${x.reason}</td></tr>`).join('')}</table>`:'No trades yet';$('msg').textContent=`Runs stored: ${r.length}`}catch(e){$('msg').textContent=e.message;$('mode').className='status danger'}}
async function action(path,body){$('msg').textContent='Working...';try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.detail||JSON.stringify(j));cards(j.goal);$('msg').textContent='Completed';await refresh()}catch(e){$('msg').textContent=e.message}}
$('backtest').onclick=()=>action('/api/backtest',{symbol:'BTC/USDT',timeframe:'30m',bars:300});
$('improve').onclick=()=>action('/api/improve',{symbol:'BTC/USDT',timeframe:'30m',bars:500,cycles:5});
refresh();
</script></main></body></html>
